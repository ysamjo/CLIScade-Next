[project]
name = "cliscade-next"
version = "0.1.0"
description = "Beads- und ACP-Orchestrierung für OpenHands Agent Canvas"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.136.3",
  "httpx==0.28.1",
  "openhands-sdk==1.55.1",
  "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.13.1"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
