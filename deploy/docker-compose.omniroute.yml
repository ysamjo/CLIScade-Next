services:
  omniroute:
    image: diegosouzapw/omniroute:3.8.51@sha256:8bd462c9f60d8eda79329cfbb6ea7ea723505fe7721beb944f3d43835409e218
    restart: unless-stopped
    user: "1000:1000"
    env_file: omniroute.env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: 0.0.0.0
      REQUIRE_API_KEY: "true"
      OMNIROUTE_MEMORY_MB: "512"
      NODE_OPTIONS: --max-old-space-size=512
    mem_limit: 1g
    cpus: 1.0
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - /DATA/AppData/cliscade-next/omniroute:/app/data
    security_opt:
      - no-new-privileges:true
